version: "3.9"

# Full local stack: Postgres + LocalStack (standing in for SQS, EventBridge,
# S3, SNS, Lambda) + the two long-running services. `dispatch-notify-lambda`
# is deliberately NOT wired into this compose file as an always-on
# container — in real AWS it's invoked on-demand by the EventBridge rule,
# not run as a server, so exercising it locally is done with
# `cargo lambda watch` / `cargo lambda invoke` (see services/dispatch-notify-lambda/README.md)
# rather than docker-compose. That distinction — "this deployable is
# event-invoked, not long-running" — is itself one of the things worth being
# able to explain in an interview.
#
# Two ways to get dispatch-api/dispatch-worker running, your choice:
#   1. Pull the prebuilt image CI already tested and published (no local
#      compile at all — recommended if your machine is older/lower-power):
#        docker compose pull dispatch-api dispatch-worker
#        docker compose up
#   2. Build locally from source (needs a reasonably capable machine — see
#      each service's Dockerfile `dev` stage comment for why the first
#      build is still nontrivial even in debug mode):
#        docker compose up --build
# Both `image:` and `build:` are set below on purpose: `docker compose pull`
# uses `image:`, `docker compose build`/`--build` uses `build:` and tags the
# result as that same `image:` name, and plain `docker compose up` (no pull,
# no --build) just runs whichever of the two you did last.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # Pinned to 4.14.0 deliberately, NOT the floating `:3` tag. LocalStack
    # archived its GitHub repo on 2026-03-23 and moved every image built
    # after that date behind a required LOCALSTACK_AUTH_TOKEN — a `:3` pull
    # today silently resolves to one of those post-archive builds, which
    # start fine (health check passes) but return broken/garbled responses
    # on real API calls without a token — exactly the "500 InternalError /
    # Expecting property name enclosed in double quotes" failures this
    # queue was hitting. 4.14.0 (2025-02-26) is the last free, unauthenticated
    # release before the archive, so it's the newest tag guaranteed to keep
    # working with no account. See infra/terraform-ec2-k3s/README.md for
    # the fuller writeup.
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs,events,s3,sns,lambda
      DEFAULT_REGION: eu-central-1
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - "./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro"
      - "localstack-data:/var/lib/localstack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  dispatch-api:
    # Published by ci.yml's `publish-images` job on every push to main —
    # this is the same fully-optimized `runtime` build CI already tested,
    # for both amd64 and arm64. `docker compose pull` fetches it directly,
    # no local Rust compilation needed.
    image: ghcr.io/jupiterbarua/velocity-dispatch/dispatch-api:latest
    build:
      context: .
      dockerfile: services/dispatch-api/Dockerfile
      # Debug-profile build (see the Dockerfile's `dev` stage comment) — a
      # from-scratch `--release` build under Cargo.toml's lto/codegen-units=1
      # profile can take well over an hour on a real laptop. CI and
      # deploy.yml never build this target; they explicitly pass
      # `target: runtime` and always ship the fully-optimized binary.
      target: dev
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch
      AWS_ENDPOINT_URL: http://localstack:4566
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  dispatch-worker:
    # See the matching comment on dispatch-api's image above.
    image: ghcr.io/jupiterbarua/velocity-dispatch/dispatch-worker:latest
    build:
      context: .
      dockerfile: services/dispatch-worker/Dockerfile
      # See the matching comment on dispatch-api's build.target above.
      target: dev
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch
      AWS_ENDPOINT_URL: http://localstack:4566
    # Depends only on its actual infrastructure dependencies (Postgres,
    # LocalStack) — NOT on dispatch-api. The two services no longer share a
    # startup-order dependency now that both run their own migrations (see
    # the comment in services/dispatch-worker/src/db.rs::connect) — Compose
    # is free to start them in either order or simultaneously, which is the
    # actual test of "these are independent services," not just an
    # architecture diagram claim.
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  pgdata:
  localstack-data:
