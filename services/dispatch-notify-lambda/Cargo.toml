[package]
name = "dispatch-notify-lambda"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "AWS Lambda triggered by EventBridge on DispatchAssigned: sends the rider/driver notification and writes an audit record to S3"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
dispatch-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

lambda_runtime = "0.13"
aws_lambda_events = { version = "0.15", default-features = false, features = ["eventbridge"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-sns = "1"
anyhow = "1"
