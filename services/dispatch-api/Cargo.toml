[package]
name = "dispatch-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Public REST API for creating orders and registering drivers; publishes OrderCreated events to SQS"

[[bin]]
name = "dispatch-api"
path = "src/main.rs"

[dependencies]
dispatch-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

actix-web = "4"
actix-cors = "0.7"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sqs = "1"
dotenvy = "0.15"
tracing-actix-web = "0.7"
