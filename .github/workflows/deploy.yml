name: Deploy

# Manually triggered on purpose (see the comment in ci.yml) — this pushes
# real images to ECR and updates real ECS services / a real Lambda function.
# Uses OIDC (`permissions: id-token: write` + `aws-actions/configure-aws-credentials`
# with `role-to-assume`) rather than long-lived `AWS_ACCESS_KEY_ID` secrets —
# no static AWS credentials are stored in GitHub at all, which is the current
# baseline-secure way to let CI touch an AWS account.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: dispatch-api
            repo: velocity-dispatch/dispatch-api
          - service: dispatch-worker
            repo: velocity-dispatch/dispatch-worker
          - service: dispatch-notify-lambda
            repo: velocity-dispatch/dispatch-notify-lambda
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/velocity-dispatch-ci-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.repo }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-apply:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment }} # ties into GitHub's environment protection rules / required reviewers for prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/velocity-dispatch-ci-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_container_image_tag: ${{ needs.build-and-push.outputs.image_tag }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          # Must match the repo the OIDC trust policy was bootstrapped with
          # (see docs/DEPLOYMENT_GUIDE.md step 1) — ${{ github.repository }}
          # is already "org/repo" in exactly that format.
          TF_VAR_github_repository: ${{ github.repository }}
        run: terraform apply -auto-approve
