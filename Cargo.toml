[workspace]
resolver = "2"
members = [
    "crates/dispatch-core",
    "services/dispatch-api",
    "services/dispatch-worker",
    "services/dispatch-notify-lambda",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jupiter Barua <jupiterbarua@gmail.com>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dispatch-core = { path = "crates/dispatch-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Dependencies only (the `"*"` glob excludes this workspace's own crates, which
# keep the default `[profile.dev]` `debug = 2`). A debug build of this graph is
# 433 crates, and emitting full DWARF for all of them dominates both codegen
# time and target-dir size — which bites hardest inside a CPU- and
# memory-limited Docker VM, where `docker compose up --build` runs. Line tables
# are enough to keep backtraces readable (file + line, no variable inspection),
# and stepping through AWS SDK internals in a debugger is not something local
# dev on this project actually does.
[profile.dev.package."*"]
debug = "line-tables-only"
