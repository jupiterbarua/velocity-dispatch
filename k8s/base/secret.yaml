# NOTE ON WHY THIS IS SAFE TO COMMIT: every value below is the same
# throwaway literal already sitting in .env.example and docker-compose.yml
# ("dispatch"/"dispatch" for Postgres, "test"/"test" for LocalStack's fake
# AWS credentials). None of it is a real secret, which is exactly why it's
# fine to check in — a k8s Secret is base64-encoded, NOT encrypted, and
# checking one into git only ever makes sense when what's inside it is a
# local-only dummy value like this. If this workload were promoted to real
# AWS (the infra/terraform ECS setup already targets real RDS/SQS), these
# values would come from AWS Secrets Manager / SSM Parameter Store via
# something like External Secrets Operator, or from IRSA (IAM Roles for
# Service Accounts) for the AWS credentials specifically — never a plain
# committed Secret. Documented here rather than left implicit, since "how
# would this differ in production" is exactly the kind of question this
# repo exists to be able to answer out loud.
apiVersion: v1
kind: Secret
metadata:
  name: dispatch-secrets
  namespace: velocity-dispatch
type: Opaque
stringData:
  DATABASE_URL: "postgres://dispatch:dispatch@postgres:5432/dispatch"
  # aws_config::load_defaults() in dispatch-api/dispatch-worker's main.rs
  # picks these up as standard AWS SDK env vars — LocalStack accepts any
  # non-empty access key/secret, "test"/"test" is its own documented
  # convention (see infra/localstack/init-aws.sh using the same pair).
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
